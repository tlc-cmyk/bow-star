<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#140c16" />
  <meta name="description" content="弓弦星——用弓拉《一閃一閃》。跟拍子拉小提琴，左手自動按音。" />
  <title>弓弦星</title>
  <link rel="stylesheet" href="style.css?v=20261110a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140c16'/%3E%3Cpath d='M32 8l3.5 10.5L46 22l-10.5 3.5L32 36l-3.5-10.5L18 22l10.5-3.5Z' fill='%23f4c45a'/%3E%3Crect x='14' y='40' width='36' height='4' rx='1.5' fill='%23c48a4a'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="app">
    <canvas id="stage" aria-label="弓弦星遊戲畫面"></canvas>

    <div id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-top">
        <div class="hud-score-wrap">
          <span class="hud-label">名演度</span>
          <span id="hud-score">—</span>
        </div>
        <button type="button" id="btn-mute" class="icon-btn" aria-label="靜音">聲</button>
      </div>
    </div>

    <section id="screen-title" class="panel" aria-labelledby="game-title">
      <div class="panel-inner">
        <p class="eyebrow">即玩小遊戲</p>
        <h1 id="game-title">弓弦星</h1>
        <p class="subtitle">用弓拉《一閃一閃》</p>
        <ul class="howto">
          <li><strong>左右拉弓</strong>、<strong>上下揀弦</strong>；左手自動按音。</li>
          <li>跟拍子拉《一閃一閃》。</li>
          <li>太慢會沙、太快會飄、錯弦音會跳。</li>
          <li>弓毛有限，最好喺音符開頭掉轉。</li>
        </ul>
        <button type="button" id="btn-start" class="btn primary">開始</button>
        <button type="button" id="btn-mute-title" class="btn ghost">聲音：開</button>
      </div>
    </section>

    <section id="screen-result" class="panel hidden" aria-labelledby="result-title">
      <div class="panel-inner result-inner">
        <p class="eyebrow">演奏痕跡</p>
        <canvas id="trace-card" width="640" height="280" aria-label="呢次演奏嘅痕跡"></canvas>
        <h2 id="result-title">評級</h2>
        <p id="result-headline" class="grade">—</p>
        <p id="result-score" class="result-score">名演度 —</p>
        <p id="result-best" class="result-best hidden">自我最佳更新</p>
        <p id="result-sub" class="result-sub"></p>
        <button type="button" id="btn-retry" class="btn primary">再拉一次</button>
        <button type="button" id="btn-home" class="btn ghost">返回標題</button>
        <button type="button" id="btn-mute-result" class="btn ghost">聲音：開</button>
      </div>
    </section>

    <div id="rotate-hint" class="rotate-hint hidden">請將裝置直立</div>
  </div>

  <script src="engine.js?v=20261110a"></script>
  <script src="audio.js?v=20261110a"></script>
  <script src="game.js?v=20261110a"></script>
</body>
</html>
