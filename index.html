<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f3eee6" />
  <meta name="description" content="弓弦星——用弓拉《一閃一閃》、《兩隻老虎》、《歡樂頌》同《校歌》。跟拍子拉小提琴，左手自動按音。" />
  <title>弓弦星</title>
  <link rel="stylesheet" href="style.css?v=20261110f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3eee6'/%3E%3Cellipse cx='32' cy='38' rx='16' ry='18' fill='%23c17a38' stroke='%232a241c' stroke-width='2'/%3E%3Crect x='28' y='8' width='8' height='24' rx='2' fill='%2316110e'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="app">
    <canvas id="stage" aria-label="弓弦星遊戲畫面"></canvas>

    <div id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-top">
        <div class="hud-name-wrap">
          <div class="hud-name">弓弦星</div>
          <div id="hud-song" class="hud-song"></div>
        </div>
        <div class="hud-right">
          <div class="hud-score-wrap">
            <span class="hud-label">演奏分</span>
            <span id="hud-score">—</span>
          </div>
          <button type="button" id="btn-mute" class="icon-btn" aria-label="靜音" title="靜音">
            <svg class="ico-on" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 8.2h2.6l3.7-3.2v10L5.6 11.8H3V8.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M12.2 7.4c.9.8.9 2.4 0 3.2M14.3 5.8c1.8 1.6 1.8 5 0 6.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <svg class="ico-off" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 8.2h2.6l3.7-3.2v10L5.6 11.8H3V8.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M12.4 7.2l5 5.6M17.4 7.2l-5 5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <section id="screen-title" class="panel" aria-labelledby="game-title">
      <div class="panel-inner">
        <p class="eyebrow">即玩小遊戲</p>
        <h1 id="game-title">弓弦星</h1>
        <p class="subtitle">跟拍子拉小提琴</p>
        <ul class="howto">
          <li><strong>左右拉弓</strong>、<strong>上下握弦</strong>；左手自動按音。</li>
          <li>有四關：《一閃一閃》、《兩隻老虎》、《歡樂頌》同《校歌》。</li>
          <li>太慢或太快都會走音、錯弦音會跳。</li>
          <li>弓毛有限，最好喺音符開頭掉轉。</li>
        </ul>
        <div class="level-pick" role="group" aria-label="選擇關卡">
          <button type="button" class="btn primary" data-song="twinkle">第一關　一閃一閃</button>
          <button type="button" class="btn primary" data-song="tigers">第二關　兩隻老虎</button>
          <button type="button" class="btn primary" data-song="joy">第三關　歡樂頌</button>
          <button type="button" class="btn primary" data-song="school">第四關　校歌</button>
        </div>
        <button type="button" id="btn-mute-title" class="btn ghost">聲音：開</button>
      </div>
    </section>

    <section id="screen-result" class="panel hidden" aria-labelledby="result-title">
      <div class="panel-inner result-inner">
        <p class="eyebrow">演奏痕跡</p>
        <canvas id="trace-card" width="640" height="280" aria-label="呢次演奏嘅痕跡"></canvas>
        <h2 id="result-title">評級</h2>
        <p id="result-song" class="result-song"></p>
        <p id="result-headline" class="grade">—</p>
        <p id="result-score" class="result-score">演奏分 —</p>
        <p id="result-best" class="result-best hidden">自我最佳更新</p>
        <p id="result-sub" class="result-sub"></p>
        <button type="button" id="btn-next" class="btn primary hidden">下一關</button>
        <button type="button" id="btn-retry" class="btn primary">再拉一次</button>
        <button type="button" id="btn-home" class="btn ghost">返回標題</button>
        <button type="button" id="btn-mute-result" class="btn ghost">聲音：開</button>
      </div>
    </section>

    <div id="rotate-hint" class="rotate-hint hidden">請將裝置直立</div>
  </div>

  <script src="engine.js?v=20261110f"></script>
  <script src="render.js?v=20261110f"></script>
  <script src="audio.js?v=20261110f"></script>
  <script src="game.js?v=20261110f"></script>
</body>
</html>
